# ============================================================
# Modül: mod_headers - HTTP Güvenlik ve Özel Başlık Yöneticisi
# ============================================================
[module]
name = "mod_headers"
version = "1.0.0"
category = "Güvenlik & Başlıklar"
enabled = true

[settings]
hsts_enabled = true
hsts_max_age = 31536000
hsts_include_subdomains = true
x_frame_options = "SAMEORIGIN"
x_content_type_options = "nosniff"
referrer_policy = "strict-origin-when-cross-origin"
content_security_policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https:;"
permissions_policy = "camera=(), microphone=(), geolocation=()"
server_token_hidden = false # Server: zmaxserver başlığı

