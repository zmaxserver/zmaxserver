# ============================================================
# Modül: mod_ssl - TLS 1.3 / 1.2 Şifreleme ve SNI Yöneticisi
# ============================================================
[module]
name = "mod_ssl"
version = "1.0.0"
category = "Güvenlik & Kriptografi"
enabled = true

[settings]
min_tls_version = "1.2"
preferred_tls_version = "1.3"
ciphers = [
    "TLS_AES_128_GCM_SHA256",
    "TLS_AES_256_GCM_SHA384",
    "TLS_CHACHA20_POLY1305_SHA256"
]
alpn_protocols = ["h2", "http/1.1"]
ocsp_stapling = true
session_cache_size = 20480
session_timeout_sec = 86400
hsts_preload = true

