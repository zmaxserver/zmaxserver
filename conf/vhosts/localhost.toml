# ============================================================
# Sanal Konak: localhost (Varsayılan Web Sitesi)
# ============================================================

[vhost]
name = "localhost"
aliases = ["127.0.0.1", "::1"]
document_root = "www/html"
index_files = ["index.html", "index.htm", "index.php"]

[vhost.cache]
enabled = true
expire = 300

[vhost.php]
enabled = true
sapi = "fastcgi"
upstream = "127.0.0.1:9000"
timeout = 60

[vhost.security]
hotlink_protection = false
force_https = false

