# zMax Server Seccomp Policy (nsjail / Kafel uyumlu profil)
# Referans: google/nsjail seccomp-bpf (I-02 / izalasyon.md)
# Politika: Whitelist yaklaşımı (DEFAULT KILL)

DEFAULT KILL

# İzin verilen temel sistem çağrıları (sistem servis operasyonları)
ALLOW {
    read, write, open, openat, close, stat, fstat, lstat,
    poll, select, pselect6, epoll_create, epoll_create1, epoll_ctl, epoll_wait, epoll_pwait,
    lseek, mmap, mprotect, munmap, brk, rt_sigaction, rt_sigprocmask, rt_sigreturn,
    ioctl, pread64, pwrite64, readv, writev, access, pipe, pipe2,
    sched_yield, mremap, msync, mincore, madvise,
    socket, connect, accept, accept4, sendto, recvfrom, sendmsg, recvmsg,
    shutdown, bind, listen, getsockname, getpeername, socketpair, setsockopt, getsockopt,
    clone, fork, vfork, execve, exit, wait4, kill, uname,
    fcntl, flock, fsync, fdatasync, truncate, ftruncate, getdents, getdents64,
    getcwd, chdir, fchdir, rename, renameat, renameat2, mkdir, mkdirat, rmdir, creat,
    unlink, unlinkat, readlink, readlinkat, chmod, fchmod, chown, fchown, lchown,
    umask, gettimeofday, getrlimit, getrusage, sysinfo, times,
    getuid, getgid, setuid, setgid, geteuid, getegid, setpgid, getppid, getpgrp,
    setsid, setreuid, setregid, getgroups, setgroups, setresuid, getresuid, setresgid, getresgid,
    futex, set_tid_address, timer_create, timer_settime, timer_gettime, timer_delete,
    clock_gettime, clock_getres, clock_nanosleep, exit_group,
    tgkill, arch_prctl, prctl, getcpu, eventfd2
}

# İhlal girişimi durumunda kontrollü ret ve loglama (ERRNO 1 / EPERM)
ERRNO(1) {
    ptrace, process_vm_readv, process_vm_writev,
    kexec_load, reboot, init_module, delete_module,
    bpf, perf_event_open, userfaultfd
}
