# zMax Server — Bildirimsel Jail / Sandbox Profili (default.cfg)
# Referans: google/nsjail (I-03, I-10 / izalasyon.md)
# Kiracı / Komut Başına İzolasyon ve Kaynak Kotası Şeması

name: "zmax-tenant-sandbox"
description: "zMax Server nsjail referenced tenant isolation profile"
mode: ONCE
hostname: "zmax-sandbox"
cwd: "/var/www"

# Zaman ve CPU Kotası
time_limit: 30
max_cpus: 1

# cgroups v1 ve v2 kaynak kotaları (I-03)
cgroup_mem_max: 268435456       # 256 MB maksimum bellek
cgroup_mem_mount: "/sys/fs/cgroup/memory"
cgroup_pids_max: 64              # En fazla 64 eşzamanlı alt süreç
cgroup_pids_mount: "/sys/fs/cgroup/pids"
cgroup_cpu_ms_per_sec: 500       # %50 CPU kotası
cgroup_cpu_mount: "/sys/fs/cgroup/cpu"

# rlimit sınırları (I-07)
rlimit_as: 512                   # 512 MB sanal adres alanı
rlimit_cpu: 30                   # 30 sn CPU sınırı
rlimit_nofile: 1024              # 1024 dosya tanıtıcısı sınırı
rlimit_nproc: 64                 # 64 süreç sınırı

# Linux Namespaces İzolasyonu (I-04)
clone_newnet: true               # İzole ağ ad alanı (netns - I-06)
clone_newuser: true              # Rootless kullanıcı ad alanı
clone_newns: true                # Mount ad alanı
clone_newpid: true               # İzole PID ad alanı
clone_newipc: true               # İzole IPC ad alanı
clone_newuts: true               # İzole UTS (hostname)
clone_newcgroup: true            # İzole cgroup ad alanı

# Mount Haritası: Salt-Okunur Sistem Dizinleri & İzole Tmpfs (I-05)
mount {
    src: "/usr"
    dst: "/usr"
    is_bind: true
    rw: false
}
mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
}
mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
}
mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    rw: false
}
mount {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
}

# Seccomp BPF Filtre Referansı (I-02)
seccomp_string: "conf/seccomp/zmax_seccomp.cfg"
