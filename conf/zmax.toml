[cache]
default_ttl_seconds = 300
disk_cache_dir = "cachedata"
enabled = true
memory_cache_mb = 256
purge_key_header = "X-ZMax-Purge-Key"
stale_while_revalidate_sec = 30

[[extapps]]
address = "127.0.0.1:9084"
app_type = "LSAPI"
backlog = 100
enabled = true
env = []
ext_path = ""
id = "lsphp84_test"
init_timeout = 60
instances = 8
max_conns = 40
mem_hard_limit_mb = 2047
mem_soft_limit_mb = 2047
name = "LSPHP 8.4 Test Pool"
persist_conn = true
priority = 0
proc_hard_limit = 400
proc_soft_limit = 400
resp_buffer = true
retry_timeout = 0
run_on_startup = true

[extapps.env_vars]
PHP_LSAPI_CHILDREN = "8"

[listeners]
custom = []

[listeners.admin]
address = "127.0.0.1"
document_root = "admin"
enabled = true
port = 19485
proxy_prefix = ""
require_token = false
ssl = false
tls_cert = ""
tls_key = ""
token = ""
trusted_proxies = []

[listeners.api]
address = "127.0.0.1"
cors_allow_origin = "*"
enabled = true
port = 19486
proxy_prefix = ""
read_token = ""
require_token = false
ssl = false
tls_cert = ""
tls_key = ""
token = ""
trusted_proxies = []
unix_socket = ""

[listeners.http]
address = "0.0.0.0"
backlog = 4096
enabled = true
port = 19480
proxy_protocol = false
reuse_port = false
tcp_nodelay = true

[listeners.https]
address = "0.0.0.0"
alpn = [
    "h2",
    "http/1.1",
]
enabled = false
port = 19483
proxy_protocol = false
ssl = true
strict_sni = false

[logging]
access_log = "logs/access.log"
add_request_id = true
batch_buffer_kb = 64
batch_flush_ms = 250
error_log = "logs/error.log"
log_format = '%h %l %u %t "%r" %>s %b "%{Referer}i" "%{User-Agent}i"'
log_level = "info"
max_log_size_mb = 100

[sandbox]
cgroup_cpu_percent = 50
cgroup_mem_limit_mb = 256
cgroup_pids_limit = 64
enabled = true
engine = "nsjail"
network_isolated = true
profile = "conf/jail/default.cfg"
read_only_root = true
seccomp_policy = "conf/seccomp/zmax_seccomp.cfg"

[security]
allow_ips = []
api_rate_limit_per_minute = 600
auth_ban_sec = 900
auth_fail_limit = 5
auth_fail_window_sec = 300
auth_max_concurrent_hashes = 4
ban_exempt_ips = []
block_path_traversal = true
deny_ips = []
keep_alive_timeout_sec = 65
max_body_size_mb = 64
max_header_size_kb = 64
rate_limit_enabled = true
rate_limit_per_minute = 2000
slowloris_body_timeout_sec = 30
slowloris_header_timeout_sec = 12

[server]
cpu_affinity = true
graceful_shutdown_secs = 15
group = "nobody"
listeners = []
priority = 0
reuseport_workers = true
script_handlers = []
server_name = "ZMax Challenger Node"
tmp_dir = ""
user = "nobody"
workers = 4

[server.acme]
force_https_exempt = true

[[server.ext_apps]]
address = "127.0.0.1:9084"
app_type = "LSAPI"
backlog = 100
enabled = true
env = []
ext_path = ""
id = "lsphp84_test"
init_timeout = 60
instances = 8
max_conns = 40
mem_hard_limit_mb = 2047
mem_soft_limit_mb = 2047
name = "LSPHP 8.4 Test Pool"
persist_conn = true
priority = 0
proc_hard_limit = 400
proc_soft_limit = 400
resp_buffer = true
retry_timeout = 0
run_on_startup = true

[server.ext_apps.env_vars]
PHP_LSAPI_CHILDREN = "8"

[server.tuning]
brotli_enabled = true
brotli_level = 6
cache_static = true
compress_mime_types = [
    "text/html",
    "text/plain",
    "text/css",
    "application/javascript",
    "application/json",
    "application/xml",
    "image/svg+xml",
]
connection_timeout = 60
gzip_enabled = true
gzip_level = 6
http3_enabled = true
http3_port = 443
io_model = "auto"
keep_alive_timeout = 15
max_cached_file_size_kb = 1024
max_connections = 10000
max_keep_alive_req = 1000
max_ssl_connections = 5000
min_compress_size = 256
rcv_buf_size = 0
smart_keep_alive = true
snd_buf_size = 0
ssl_cache_size = 1000000
ssl_cache_timeout = 3600
ssl_session_cache = true
ssl_session_tickets = true
total_in_mem_cache_mb = 256

[tuning]
brotli_enabled = true
brotli_level = 6
cache_static = true
compress_mime_types = [
    "text/html",
    "text/plain",
    "text/css",
    "application/javascript",
    "application/json",
    "application/xml",
    "image/svg+xml",
]
connection_timeout = 45
gzip_enabled = true
gzip_level = 6
http3_enabled = false
http3_port = 443
io_model = "auto"
keep_alive_timeout = 60
max_cached_file_size_kb = 1024
max_connections = 25000
max_keep_alive_req = 2000
max_ssl_connections = 5000
min_compress_size = 256
rcv_buf_size = 0
smart_keep_alive = true
snd_buf_size = 0
ssl_cache_size = 1000000
ssl_cache_timeout = 3600
ssl_session_cache = true
ssl_session_tickets = true
total_in_mem_cache_mb = 256

[vhosts_dir]
path = "conf/vhosts"
