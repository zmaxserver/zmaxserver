<script>
(function () {
  var durum = document.getElementById('durum');

  function svgMetni() {
    var s = document.getElementById('semaSvg').cloneNode(true);

    s.setAttribute('width', vb.width);
    s.setAttribute('height', vb.height);
    return new XMLSerializer().serializeToString(s);
  }
  function indir(adres, ad) {
    var a = document.createElement('a');
    a.href = adres; a.download = ad;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
  document.getElementById('btnSvg').addEventListener('click', function () {

    var url = URL.createObjectURL(new Blob([svgMetni()], { type: 'image/svg+xml;charset=utf-8' }));

      try {
        var c = document.createElement('canvas');

        x.fillStyle = '#fafbfd'; x.fillRect(0, 0, c.width, c.height);

      } catch (e) { hata('PNG oluşturulamadı: ' + e.message); }
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    };
    img.onerror = function () { hata('Şema görüntüye çevrilemedi; SVG olarak indirin.'); URL.revokeObjectURL(url); };
    img.src = url;
  });
})();
