[package]
name = "zmax-fastcgi"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zmax-pool = { path = "../zmax-pool" }
tokio = { version = "1.38", features = ["net", "io-util", "time"] }
bytes = "1.6"

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt", "rt-multi-thread"] }

