[package]
name = "zmax-redis"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zmax-core = { path = "../zmax-core" }
tokio = { version = "1.38", features = ["net", "io-util", "sync"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }

