[package]
name = "zmax-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.38", features = ["net", "io-util", "time", "macros", "fs", "sync", "rt"] }
bytes = "1.6"
httparse = "1.10.1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }

